<section class="chat-shell" *ngIf="currentUser() as user">
  <main class="chat-panel panel" style="display: grid; place-items: center; padding: 32px; min-height: 70vh;">
    <div style="max-width: 760px; text-align: center;">
      <h2 style="margin: 0 0 8px 0; display:flex; gap:12px; align-items:center; justify-content:center;"> 
        <img [src]="user.profile.avatarUrl || defaultAvatar" alt="avatar" style="width:56px;height:56px;border-radius:999px;object-fit:cover;margin-right:8px;"> 
        Uspešno ste prijavljeni
      </h2>
      <p style="margin: 0 0 16px 0; color: var(--muted);">
        Dobrodošli, {{ user.profile.displayName }}. Ovo je kostur aplikacije za prvi push: registracija + prijava/odjava.
      </p>
      <p style="margin: 0 0 20px 0; color: var(--muted);">
        Sledeći korak može biti dodavanje poruka, razgovora i grupa.
      </p>
      <button class="primary" type="button" (click)="logout()">Odjava</button>
    </div>
  </main>
</section>
